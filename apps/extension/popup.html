<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>School Collect 업무 자동화</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>School Collect</h1>
    <p class="hint">
      현재 탭을 업무 버튼으로 등록하거나 화면 요소를 골라 자동입력 레시피를
      만듭니다. 페이지 내용, 쿠키, 로그인 정보는 보내지 않습니다.
    </p>

    <label for="token">연결 토큰</label>
    <input
      id="token"
      type="password"
      autocomplete="off"
      placeholder="앱의 업무 자동화 화면에서 복사"
    />
    <div class="row">
      <button id="save" type="button">토큰 저장</button>
      <button id="check" type="button" class="secondary">연결 확인</button>
    </div>

    <hr />

    <h2>바로가기</h2>
    <label for="name">버튼 이름</label>
    <input
      id="name"
      type="text"
      maxlength="80"
      placeholder="비우면 탭 제목을 씁니다"
    />
    <div class="row">
      <button id="register" type="button">현재 화면 등록</button>
    </div>

    <hr />

    <h2>레시피 추천</h2>
    <p class="hint">
      현재 화면 구조를 읽어 바로 실행할 수 있는 레시피만 제안합니다. 입력 값은 읽거나
      보내지 않습니다.
    </p>
    <div class="row">
      <button id="suggest" type="button" class="secondary">화면 분석</button>
    </div>
    <ul id="suggestions" class="fields"></ul>

    <hr />

    <h2>자동입력 레시피</h2>
    <div class="row">
      <button id="pick" type="button" class="secondary">화면에서 요소 선택</button>
    </div>

    <div id="picker" hidden>
      <p id="picked" class="hint"></p>
      <div id="candidates" class="candidates"></div>
      <label for="field-label">필드 이름</label>
      <input id="field-label" type="text" maxlength="80" placeholder="예: 제목" />
      <div class="row">
        <button id="add-field" type="button">필드 추가</button>
      </div>
    </div>

    <ul id="fields" class="fields"></ul>

    <label for="recipe-name">레시피 이름</label>
    <input id="recipe-name" type="text" maxlength="80" placeholder="예: 기안 작성" />
    <div class="row">
      <button id="save-recipe" type="button">자동입력 레시피 저장</button>
    </div>

    <hr />

    <h2>미리보기</h2>
    <label for="recipe-select">저장된 자동입력 레시피</label>
    <select id="recipe-select"></select>
    <div class="row">
      <button id="preview" type="button" class="secondary">미리보기(dry-run)</button>
    </div>
    <ul id="preview-results" class="fields"></ul>

    <div id="values" class="fields"></div>
    <div class="row">
      <button id="fill" type="button">입력 실행</button>
    </div>
    <ul id="fill-results" class="fields"></ul>

    <hr />

    <h2>표 입력 레시피</h2>
    <div class="row">
      <button id="pick-table" type="button" class="secondary">표 등록(셀 클릭)</button>
    </div>
    <p id="table-picked" class="hint"></p>
    <label for="table-name">레시피 이름</label>
    <input id="table-name" type="text" maxlength="80" placeholder="예: 출결 입력" />
    <div class="row">
      <button id="save-table-recipe" type="button">표 레시피 저장</button>
    </div>

    <label for="table-select">저장된 표 레시피</label>
    <select id="table-select"></select>
    <div class="row">
      <button id="table-preview" type="button" class="secondary">표 미리보기</button>
    </div>
    <label for="table-values">행렬 값(탭으로 구분)</label>
    <textarea id="table-values" rows="6" spellcheck="false"></textarea>
    <div class="row">
      <button id="table-fill" type="button">표 입력 실행</button>
    </div>
    <ul id="table-results" class="fields"></ul>

    <hr />

    <h2>감시 레시피</h2>
    <div class="row">
      <button id="pick-watch" type="button" class="secondary">감시 등록(행 클릭)</button>
    </div>
    <p id="watch-picked" class="hint"></p>
    <label for="watch-name">레시피 이름</label>
    <input id="watch-name" type="text" maxlength="80" placeholder="예: 체험학습 신청 감시" />
    <div class="row">
      <button id="save-watch-recipe" type="button">감시 레시피 저장</button>
    </div>

    <label for="watch-select">저장된 감시 레시피</label>
    <select id="watch-select"></select>
    <div class="row">
      <button id="watch-scan" type="button">감시 실행</button>
    </div>
    <ul id="watch-results" class="fields"></ul>

    <p id="status" role="status"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
