name: V2 Architecture

on:
  pull_request:
    branches: [develop]
    paths:
      - "apps/app/**"
      - "packages/**"
      - "services/**"
      - "crates/**"
      - "migrations/**"
      - "infra/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/v2-architecture.yml"
  push:
    branches: [develop]
    paths:
      - "apps/app/**"
      - "packages/**"
      - "services/**"
      - "crates/**"
      - "migrations/**"
      - "infra/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/v2-architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies for the Tauri crate
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck v2 app
        run: pnpm --filter @school-collect/app typecheck
      - name: Typecheck shared UI package
        run: pnpm --filter @school-collect/ui typecheck
      - name: Build v2 web assets
        run: pnpm --filter @school-collect/app build
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked

  lockfiles-verified:
    name: lockfiles-verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Committed pnpm lockfile must satisfy every workspace package
        run: pnpm install --frozen-lockfile
      - name: Committed Cargo.lock must be current
        run: cargo metadata --locked --format-version 1 > /dev/null

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: school_collect
          POSTGRES_USER: school_collect
          POSTGRES_PASSWORD: school_collect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_collect -d school_collect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://school_collect:school_collect_ci@127.0.0.1:5432/school_collect
      MIGRATION_DATABASE_URL: postgres://school_collect:school_collect_ci@127.0.0.1:5432/school_collect
      RUNTIME_DATABASE_URL: postgres://school_collect_runtime:school_collect_runtime_ci@127.0.0.1:5432/school_collect
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Confirm the target database starts empty
        run: |
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema='public'")" = "0"
      - name: Run v2 migrations on the empty database
        run: cargo run -p school-collect-migrator --locked
      - name: Verify migration outcome and absence of demo seed rows
        run: |
          test "$(psql "$DATABASE_URL" -tAc "select schema_version from app_meta")" = "v2-bootstrap"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from _sqlx_migrations where success")" = "$(ls migrations/v2/*.sql | wc -l)"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema='school_collect' and table_name in ('tenants','users','memberships','invitations','collects','collect_items','collect_assignments','collect_submissions','audit_events','outbox_events')")" = "10"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from school_collect.collects")" = "0"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from school_collect.users")" = "0"
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('tenants','users','memberships','invitations','collects','collect_items','collect_assignments','collect_submissions','audit_events','outbox_events')")" = "0"
      - name: Re-running migrations must be a no-op
        run: cargo run -p school-collect-migrator --locked
      - name: Tenant isolation across pooled connections
        run: cargo test -p school-collect-db --locked
      - name: Outbox relay (database side)
        run: cargo test -p school-collect-worker --locked
      - name: Runtime role writes rows but cannot run DDL
        run: bash scripts/runtime_role_check.sh
      - name: The migrator refuses to start without its own URL
        shell: bash
        env:
          MIGRATION_DATABASE_URL: ""
        run: |
          if cargo run -p school-collect-migrator --locked > /tmp/migrator-nourl.log 2>&1; then
            echo "the migrator ran without MIGRATION_DATABASE_URL"
            exit 1
          fi
          grep -q "MIGRATION_DATABASE_URL is required" /tmp/migrator-nourl.log
      - name: Backup and restore drill
        shell: bash
        env:
          SOURCE_DATABASE_URL: postgres://school_collect:school_collect_ci@127.0.0.1:5432/school_collect
          RESTORE_DATABASE_URL: postgres://school_collect:school_collect_ci@127.0.0.1:5432/school_collect_restore
          PG_CLIENT_IMAGE: postgres:18
          DRILL_CANARY: "1"
        run: |
          psql "$SOURCE_DATABASE_URL" -c 'CREATE DATABASE school_collect_restore'
          bash scripts/backup_restore_drill.sh
      - name: Missing configuration must fail startup instead of degrading
        shell: bash
        env:
          DATABASE_URL: ""
        run: |
          if cargo run -p school-collect-api --locked > /tmp/api-noconfig.log 2>&1; then
            echo "API started without DATABASE_URL; configuration errors must not be tolerated"
            exit 1
          fi
          grep -q "DATABASE_URL is required" /tmp/api-noconfig.log
      - name: Readiness must be false while PostgreSQL is unreachable
        shell: bash
        env:
          DATABASE_URL: postgres://school_collect:school_collect_ci@127.0.0.1:1/school_collect
          APP_BIND_ADDR: 127.0.0.1:3001
        run: |
          cargo run -p school-collect-api --locked > /tmp/api-nodb.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/health >/dev/null
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/ready)
          if [ "$code" != "503" ]; then
            echo "expected /ready 503 while PostgreSQL is unreachable, got $code"
            cat /tmp/api-nodb.log
            exit 1
          fi
      - name: Readiness must be true once PostgreSQL is reachable
        shell: bash
        run: |
          cargo run -p school-collect-api --locked > /tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
              curl --fail --silent http://127.0.0.1:3000/health >/dev/null
              curl --fail --silent http://127.0.0.1:3000/openapi.json >/dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

  nats-outbox:
    name: nats-outbox
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: school_collect
          POSTGRES_USER: school_collect
          POSTGRES_PASSWORD: school_collect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_collect -d school_collect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://school_collect:school_collect_ci@127.0.0.1:5432/school_collect
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js
      - name: Wait for NATS
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "NATS did not accept connections"
          exit 1
      - name: Outbox relay against JetStream
        run: cargo test -p school-collect-worker --locked

  container:
    name: server-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -f infra/api.Dockerfile -t school-collect-server:ci .
      - name: Run the migrator and probe readiness in the built image
        run: |
          docker network create school-collect-ci
          docker run -d --name pg --network school-collect-ci \
            -e POSTGRES_DB=school_collect -e POSTGRES_USER=school_collect \
            -e POSTGRES_PASSWORD=school_collect_ci postgres:18
          for _ in $(seq 1 30); do
            if docker exec pg pg_isready -U school_collect -d school_collect >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker run --rm --network school-collect-ci \
            -e MIGRATION_DATABASE_URL=postgres://school_collect:school_collect_ci@pg:5432/school_collect \
            --entrypoint /usr/local/bin/school-collect-migrator \
            school-collect-server:ci
          docker run -d --name api --network school-collect-ci -p 127.0.0.1:3000:3000 \
            -e APP_ENV=development \
            -e APP_BIND_ADDR=0.0.0.0:3000 \
            -e DATABASE_URL=postgres://school_collect:school_collect_ci@pg:5432/school_collect \
            school-collect-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ready >/dev/null; then
              curl -fsS http://127.0.0.1:3000/health >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs api || docker logs pg || true

  tauri-windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Windows installer (unsigned)
        working-directory: apps/app
        run: pnpm tauri build --bundles nsis
      - name: Installer must exist and carry the configured version
        shell: pwsh
        run: |
          $conf = Get-Content -Raw apps/app/src-tauri/tauri.conf.json | ConvertFrom-Json
          $dir = "target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $dir -Filter "*_$($conf.version)_x64-setup.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            Get-ChildItem -Recurse target/release/bundle -ErrorAction SilentlyContinue | Select-Object FullName, Length
            throw "expected exactly one NSIS installer for version $($conf.version) in $dir, found $($installers.Count)"
          }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) { throw "installer is unexpectedly small: $($installer.Length) bytes" }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          "installer=$($installer.Name) bytes=$($installer.Length) signature=$($signature.Status)"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/installers" | Out-Null
          Copy-Item $installer.FullName "$env:RUNNER_TEMP/installers/older-setup.exe"
          "OLDER_VERSION=$($conf.version)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build a newer installer for the upgrade check (CI only, version override)
        shell: pwsh
        working-directory: apps/app
        run: |
          $conf = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $parts = $conf.version.Split('.')
          $newer = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          # The override changes only this CI build; the repository version stays put.
          $override = @{ version = $newer } | ConvertTo-Json -Compress
          Set-Content -Path "$env:RUNNER_TEMP/version-override.json" -Value $override -Encoding utf8
          pnpm tauri build --bundles nsis --config "$env:RUNNER_TEMP/version-override.json"
          $newerInstaller = Get-ChildItem -Path ../../target/release/bundle/nsis -Filter "*_${newer}_x64-setup.exe"
          if (@($newerInstaller).Count -ne 1) { throw "newer installer for $newer not found" }
          Copy-Item $newerInstaller.FullName "$env:RUNNER_TEMP/installers/newer-setup.exe"
          "NEWER_VERSION=$newer" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install, upgrade and uninstall the app
        shell: pwsh
        run: >-
          pwsh -NoProfile -File scripts/installer_lifecycle.ps1
          -Older "$env:RUNNER_TEMP/installers/older-setup.exe"
          -Newer "$env:RUNNER_TEMP/installers/newer-setup.exe"
          -OlderVersion $env:OLDER_VERSION
          -NewerVersion $env:NEWER_VERSION
