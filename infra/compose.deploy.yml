# Deployment shape for the server side of School Collect.
#
# Values come from the environment or a secret manager; nothing here contains a
# credential. The migrator is a one-shot profile so schema changes are always an
# explicit step instead of a side effect of starting the API.
services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV to staging or production}
      APP_BIND_ADDR: 0.0.0.0:3000
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:?set the exact client origin}
      APP_AUTH_MODE: oidc
      DATABASE_URL: ${DATABASE_URL:?set the pooled PostgreSQL URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set the identity provider issuer}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-authenticated}
      # Attachment storage: private R2 when all four R2_* values are set,
      # otherwise the directory below. A partial R2 set refuses to start.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      APP_ATTACHMENT_DIR: /var/lib/school-collect/attachments
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - school_collect_attachments:/var/lib/school-collect/attachments

  migrator:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    profiles: ["migrate"]
    entrypoint: ["/usr/local/bin/school-collect-migrator"]
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV to staging or production}
      # The schema owner is a separate input from the runtime URL, so a runtime
      # credential can never be used to change the schema by accident.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set the migration PostgreSQL URL}
      RUST_LOG: ${RUST_LOG:-info}

  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/school-collect-worker"]
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV to staging or production}
      # Runtime role: the worker only reads and writes rows, never DDL.
      DATABASE_URL: ${DATABASE_URL:?set the pooled PostgreSQL URL}
      NATS_URL: ${NATS_URL:?set the NATS JetStream URL}
      # Must match the API so the retention sweep reaches the same store.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      APP_ATTACHMENT_DIR: /var/lib/school-collect/attachments
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - school_collect_attachments:/var/lib/school-collect/attachments

volumes:
  school_collect_attachments:
